<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><rect width="1080" height="1440" fill="#f6f3eb"/><rect x="48" y="48" width="984" height="1344" rx="12" fill="none" stroke="#b5c1a5" stroke-width="2"/><path d="M96 210h888M96 1220h888" stroke="#c8d0bc"/><text x="96" y="140" font-family="serif" font-size="43" fill="#234c3a">乡遇一线</text><text x="984" y="138" text-anchor="end" font-family="sans-serif" font-size="21" fill="#7c856f">2026/10/21</text><text x="96" y="309" font-family="serif" font-size="63" fill="#234c3a">我的庄河手记</text><text x="96" y="367" font-family="sans-serif" font-size="23" fill="#a86b4b">一颗草莓的乡土旅程</text><text x="96" y="459" font-family="sans-serif" font-size="23" fill="#6a795b">我的乡土路线 · 线上探索 4 / 4</text><g><circle cx="190" cy="608" r="77" fill="#f6eade" stroke="#b86b4c" stroke-width="3"/><circle cx="190" cy="608" r="65" fill="none" stroke="#b86b4c"/><text x="190" y="623" text-anchor="middle" font-family="serif" font-size="39" fill="#b86b4c">识乡</text><text x="190" y="735" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#778368">农耕记忆</text></g><g><circle cx="420" cy="608" r="77" fill="#f6eade" stroke="#b86b4c" stroke-width="3"/><circle cx="420" cy="608" r="65" fill="none" stroke="#b86b4c"/><text x="420" y="623" text-anchor="middle" font-family="serif" font-size="39" fill="#b86b4c">观田</text><text x="420" y="735" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#778368">田野观察</text></g><g><circle cx="650" cy="608" r="77" fill="#f6eade" stroke="#b86b4c" stroke-width="3"/><circle cx="650" cy="608" r="65" fill="none" stroke="#b86b4c"/><text x="650" y="623" text-anchor="middle" font-family="serif" font-size="39" fill="#b86b4c">识莓</text><text x="650" y="735" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#778368">草莓产业</text></g><g><circle cx="880" cy="608" r="77" fill="#f6eade" stroke="#b86b4c" stroke-width="3"/><circle cx="880" cy="608" r="65" fill="none" stroke="#b86b4c"/><text x="880" y="623" text-anchor="middle" font-family="serif" font-size="39" fill="#b86b4c">传乡</text><text x="880" y="735" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#778368">新农人</text></g><text x="96" y="845" font-family="serif" font-size="31" fill="#234c3a">今天，我想记住……</text><text x="96" y="917" font-family="sans-serif" font-size="25" fill="#607155">我想记住旧农具背后的劳动，也想看看棚里小小</text><text x="96" y="960" font-family="sans-serif" font-size="25" fill="#607155">的草莓花。</text><text x="96" y="1285" font-family="serif" font-size="29" fill="#234c3a">沿着故事，读懂乡土。</text><text x="96" y="1335" font-family="sans-serif" font-size="19" fill="#89937a">本卡记录线上探索进度。线下到访前请核实接待信息。</text></svg>